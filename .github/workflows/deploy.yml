name: Node.js CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get latest source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      - name: Verify deployment secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST" || { echo "EC2_HOST repository secret is missing"; exit 1; }
          test -n "$EC2_USER" || { echo "EC2_USER repository secret is missing"; exit 1; }
          test -n "$EC2_SSH_KEY" || { echo "EC2_SSH_KEY repository secret is missing"; exit 1; }
          case "$EC2_HOST" in
            http://*|https://*|*/*) echo "EC2_HOST must contain only an IPv4 address or hostname"; exit 1 ;;
          esac
          printf '%s\n' "$EC2_SSH_KEY" > /tmp/ec2-key.pem
          chmod 600 /tmp/ec2-key.pem
          openssl pkey -in /tmp/ec2-key.pem -check -noout || {
            echo "EC2_SSH_KEY is not a valid private key PEM"
            exit 1
          }

      # 4. Deploy to AWS EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/testapp
            git pull origin main
            sudo docker compose up -d --build
            sudo docker image prune -f